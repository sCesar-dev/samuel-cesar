- id: ecovision
  title:
    pt: "EcoVision - Triagem Serverless de Resíduos com Classificação de Incerteza"
    en: "EcoVision - Serverless Waste Sorting with Explicit Uncertainty Classification"
  description:
    pt: "Pipeline serverless na AWS para triagem de recicláveis com Amazon Rekognition e motor de classificação explícita de incerteza de materiais."
    en: "Serverless AWS pipeline for recyclable sorting with Amazon Rekognition and an explicit material uncertainty classification engine."
  oneLinerImpact:
    pt: "Arquitetura serverless orientada a eventos no AWS Free Tier, com modelagem de incerteza de materiais e 85% de cobertura de testes."
    en: "Event-driven serverless architecture on AWS Free Tier, with material uncertainty modeling and 85% test coverage."
  category: computer-vision
  categoryLabel:
    pt: "Visão Computacional & Nuvem AWS"
    en: "Computer Vision & AWS Cloud"
  stack: Cloud Serverless & Computer Vision
  techs:
    - AWS Lambda
    - Amazon S3
    - Amazon Rekognition
    - AWS SAM
    - Python 3.11
    - Pillow
    - pytest
    - Moto
    - CloudWatch
  hardwareBadges:
    - AWS Lambda 256MB
    - Amazon S3
    - Amazon Rekognition
    - AWS SAM (IaC)
  technicalHighlights:
    pt:
      - "Arquitetura orientada a eventos S3 -> Lambda -> Rekognition com tempo de execução enxuto (~800ms/imagem) e custo zero no AWS Free Tier."
      - "Motor desacoplado de regras determinísticas modelando incerteza em 3 estados (inferred, ambiguous, unverified) para evitar contaminação em triagem."
      - "Defesa em profundidade contra loops recursivos de eventos S3 e 85% de cobertura de testes in-memory com Moto sem custos de nuvem."
    en:
      - "Event-driven S3 -> Lambda -> Rekognition architecture with lean execution time (~800ms/image) and zero cost on AWS Free Tier."
      - "Decoupled deterministic rules engine modeling uncertainty in 3 states (inferred, ambiguous, unverified) to prevent sorting contamination."
      - "Defense-in-depth against recursive S3 event loops and 85% in-memory test coverage with Moto without cloud costs."
  architectureDiagram: /images/ecovision/architecture.png
  metrics:
