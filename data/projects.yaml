- id: biopoints
  title:
    pt: "BioPoints - Inteligência Preditiva de CO₂ & Fidelidade Sustentável"
    en: "BioPoints - Predictive CO₂ Intelligence & Sustainable Loyalty"
  description:
    pt: "Plataforma premiada com 1º Lugar no Hackathon UFBA que calcula emissões evitadas de CO₂ via Random Forest e converte em pontos de fidelidade em tempo real."
    en: "Platform awarded 1st Place at the UFBA Hackathon calculating avoided CO₂ emissions via Random Forest and converting to real-time loyalty points."
  oneLinerImpact:
    pt: "Modelo preditivo de Machine Learning (R² = 0.9964, MAE = 1.90 g/km) integrado a API NestJS para cálculo em tempo real de emissões evitadas de CO₂."
    en: "Predictive Machine Learning model (R² = 0.9964, MAE = 1.90 g/km) integrated with a NestJS API for real-time avoided CO₂ calculations."
  category: data-science
  categoryLabel:
    pt: "Ciência de Dados & Machine Learning"
    en: "Data Science & Machine Learning"
  stack: Data Science & Machine Learning
  techs:
    - Python 3.12
    - Scikit-Learn
    - Random Forest
    - NestJS
    - Prisma ORM
    - PostgreSQL
    - Pandas
    - Seaborn
  hardwareBadges:
    - "Random Forest (100 Trees)"
    - ColumnTransformer
    - NestJS IPC Stream
    - PostgreSQL 14+
  technicalHighlights:
    pt:
      - "Construção de modelo preditivo contrafactual de emissão fóssil de referência com R² de 0.9964 e MAE de 1.9035 g/km sobre 7.385 amostras."
      - "Isolamento estrito de pré-processamento via Pipeline e ColumnTransformer, blindando contra Data Leakage e tolerando categorias desconhecidas."
      - "Integração de inferência em tempo real entre NestJS e runtime Python via child_process.spawn por streaming stdin/stdout (~150ms)."
      - "1º Lugar na Trilha de IA, Cidades Inteligentes e Mudanças Climáticas no Hackathon da Liga de IA da UFBA (LIAO)."
    en:
      - "Constructed a counterfactual baseline fossil emission predictive model with R² of 0.9964 and MAE of 1.9035 g/km across 7,385 samples."
      - "Strict preprocessing isolation using Pipeline and ColumnTransformer, preventing Data Leakage and handling unseen categories."
      - "Real-time inference integration between NestJS and Python runtime via child_process.spawn through stdin/stdout streaming (~150ms)."
      - "1st Place in the AI, Smart Cities, and Climate Change track at UFBA's AI League (LIAO) Hackathon."
