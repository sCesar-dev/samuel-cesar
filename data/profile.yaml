    paragraphs:
      - pt: "Graduando em Sistemas de Informação pela Universidade do Estado da Bahia (UNEB), busco oportunidade de estágio em Engenharia de Dados, Ciência de Dados ou Visão Computacional."
        en: "Information Systems undergraduate at Bahia State University (UNEB), seeking an internship opportunity in Data Engineering, Data Science, or Computer Vision."
      - pt: "Construo pipelines de dados, modelos preditivos em Python (Scikit-Learn, Random Forest, Pandas), arquiteturas serverless na nuvem com AWS (Lambda, S3, SAM CLI) e estruturas de indexação de alto desempenho (B-Trees e Grafos)."
        en: "I engineer data pipelines, predictive models in Python (Scikit-Learn, Random Forest, Pandas), serverless cloud architectures with AWS (Lambda, S3, SAM CLI), and high-performance indexing data structures (B-Trees and Graphs)."
      - pt: "Conquistei o 1º Lugar no Hackathon LIAO / UFBA 2026 desenvolvendo a inteligência de previsão e fidelidade do projeto BioPoints. Como bolsista de iniciação científica no ACSO (UNEB), atuei durante 2 anos com robótica para robôs de serviço com ROS 2, YOLOv8 e Python e atualmente integro o ACSO DEFENSE, atuando em soluções para busca e reconhecimento utilizando drones autônomos."
        en: "Awarded 1st Place at the LIAO / UFBA 2026 Hackathon developing the predictive emission and loyalty engine for BioPoints. As an undergraduate scientific researcher at ACSO (UNEB), I worked for 2 years on service robotics with ROS 2, YOLOv8, and Python, and currently participate in ACSO DEFENSE, developing search and reconnaissance solutions with autonomous drones."
